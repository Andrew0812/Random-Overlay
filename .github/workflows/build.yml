name: Build Android APK

# Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the Java environment (Java 17 is standard for modern Android/Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # This speeds up builds by caching Gradle dependencies

      # 3. Make the Gradle wrapper executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build the Debug APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. Upload the resulting APK so you can download it from GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Random-Overlay-APK
          path: app/build/outputs/apk/debug/*.apk
